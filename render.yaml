services:
  - type: web
    name: quantum-dynamics
    runtime: python
    buildCommand: pip install -r app/requirements.txt && PYTHONPATH=app python app/manage.py collectstatic --noinput && PYTHONPATH=app python app/manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application -b 0.0.0.0:$PORT --pythonpath app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
