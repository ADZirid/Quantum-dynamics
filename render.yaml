services:
  - type: web
    name: quantum-dynamics
    runtime: python
    buildCommand: pip install -r requirements.txt && python app/manage.py collectstatic --noinput && python app/manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --chdir app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PYTHONPATH
        value: app
