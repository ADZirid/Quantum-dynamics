services:
  - type: web
    name: quantum-dynamics
    runtime: python
    buildCommand: cd app && pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: cd app && python manage.py migrate --noinput && gunicorn config.wsgi:application -b 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        value: "sqlite:////opt/render/project/src/app/db.sqlite3"
