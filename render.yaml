services:
  - type: web
    name: quantum-dynamics
    runtime: python
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
