services:
  - type: web
    name: quantum-dynamics
    runtime: python
    buildCommand: cd /opt/render/project/src/app && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: cd /opt/render/project/src/app && python manage.py migrate --noinput && gunicorn config.wsgi:application -b 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
