<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Grille technique répétable : filets 1px tous les 64px + croix de cadrage aux intersections majeures (256px), opacité 40% -->
  <g stroke="#DEDBD2" stroke-width="1" opacity="0.4">
    <!-- Filets verticaux -->
    <path d="M 64 0 V 512" />
    <path d="M 128 0 V 512" />
    <path d="M 192 0 V 512" />
    <path d="M 256 0 V 512" />
    <path d="M 320 0 V 512" />
    <path d="M 384 0 V 512" />
    <path d="M 448 0 V 512" />
    <!-- Filets horizontaux -->
    <path d="M 0 64 H 512" />
    <path d="M 0 128 H 512" />
    <path d="M 0 192 H 512" />
    <path d="M 0 256 H 512" />
    <path d="M 0 320 H 512" />
    <path d="M 0 384 H 512" />
    <path d="M 0 448 H 512" />
  </g>
  <!-- Croix de cadrage aux intersections majeures -->
  <g stroke="#DEDBD2" stroke-width="1" opacity="0.4">
    <g>
      <path d="M 121 128 H 135 M 128 121 V 135" />
      <path d="M 249 128 H 263 M 256 121 V 135" />
      <path d="M 377 128 H 391 M 384 121 V 135" />
      <path d="M 121 256 H 135 M 128 249 V 263" />
      <path d="M 249 256 H 263 M 256 249 V 263" />
      <path d="M 377 256 H 391 M 384 249 V 263" />
      <path d="M 121 384 H 135 M 128 377 V 391" />
      <path d="M 249 384 H 263 M 256 377 V 391" />
      <path d="M 377 384 H 391 M 384 377 V 391" />
      <!-- Coins de la tuile (continuité du motif répété) -->
      <path d="M 505 0 H 512 M 0 0 H 7 M 511 0 V 7 M 0 0 V 7" opacity="0" />
    </g>
  </g>
</svg>
